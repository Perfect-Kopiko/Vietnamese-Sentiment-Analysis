# Cấu hình cho mô hình PhoBERT
# Cấu hình mô hình và huấn luyện PhoBERT cho UIT-VSFC
seed: 42

data:
  train_path: "data/raw/train.csv"
  val_path: "data/raw/validation.csv"
  test_path: "data/raw/test.csv"
  text_col: "text"
  label_col: "label"
  max_length: 128          # Độ dài câu đánh giá sinh viên UIT-VSFC thường < 100 token
  use_segment: true        # Bật/tắt tách từ pyvi (PhoBERT chuẩn cần true)
  normalize_noise: true    # Bật/tắt chuẩn hóa teencode

model:
  pretrained_name: "vinai/phobert-base-v2"
  num_classes: 3           # 0: Negative, 1: Neutral, 2: Positive
  dropout: 0.3
  freeze_backbone: false   # Đặt true nếu muốn thử nghiệm chỉ train lớp Linear

training:
  epochs: 5
  batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  use_class_weights: true  # Xử lý mất cân bằng lớp Neutral (~4-5%)
  early_stopping_patience: 2
  save_dir: "checkpoints/best_phobert"

logging:
  use_wandb: true
  wandb_project: "vietnamese-sentiment-analysis"
  wandb_run_name: "phobert-v2-baseline"
  wandb_mode: "offline"    # Tự động lưu local khi wandb.ai chưa đăng nhập được